[platformio]
default_envs = d1

[env:d1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_image = 80000000L
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
build_src_filter = +<*> -<Bringup.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -DWEBSOCKETS_TCP_TIMEOUT=1500
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
lib_deps =
    moononournation/GFX Library for Arduino@1.6.9
    lvgl/lvgl@9.2.2
    bblanchon/ArduinoJson@7.4.3
    links2004/WebSockets@2.7.2

[env:d1-bringup]
extends = env:d1
build_flags = ${env:d1.build_flags} -DSENSECAP_BRINGUP
build_src_filter = +<Display.cpp> +<Bringup.cpp>


