; PlatformIO Project Configuration for ESP32-C6-WROOM-1 Smart Home Controller
; Architecture: RISC-V 32-bit single-core (ESP32-C6)

[platformio]
default_envs = esp32-c6-wroom1
data_dir = data

[env:esp32-c6-wroom1]
platform = espressif32
board = esp32-c6-devkitm-1
framework = arduino

; Serial & Monitor Configuration
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
upload_speed = 460800
upload_port = COM4
monitor_port = COM4
upload_flags =
    --before=default_reset
    --after=hard_reset

; Build Options & Preprocessor Flags
build_unflags = 
    -std=gnu++11
build_flags = 
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DWS2812_DATA_PIN=11
    -DMQTT_MAX_PACKET_SIZE=1536

; Partition Scheme for LittleFS filesystem
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv

; External Dependencies
lib_deps =
    mathieucarbou/ESPAsyncWebServer @ ^3.6.0
    mathieucarbou/AsyncTCP @ ^3.3.2
    bblanchon/ArduinoJson @ ^7.3.0
    fastled/FastLED @ ^3.9.0
    adafruit/Adafruit MCP23017 Arduino Library @ ^2.3.2
    dfrobot/DFRobot_C4002 @ ^1.0.0
    sensirion/Sensirion I2C STCC4 @ ^1.1.0
    knolleary/PubSubClient @ ^2.8
